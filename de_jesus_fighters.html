    /* Retro CRT Screen Effect */
    .crt-overlay::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));

      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
    }
    .crt-overlay::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: rgba(18, 16, 16, 0.1);
      opacity: 0;
      z-index: 40;
      pointer-events: none;
      animation: flicker 0.15s infinite;

    @keyframes flicker {

      50% { opacity: 0.22; }

    class ChiptuneAudioEngine {
      constructor() {
        this.ctx = null;
        this.bgmTimer = null;
        this.isMuted = false;
        this.currentTrack = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playPunch() {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(280, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }

      playKick() {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(350, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.16);
        gain.gain.setValueAtTime(0.45, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.16);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.16);
      }

      playBlock() {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }

      playSuper() {
        if (this.isMuted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(950, this.ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.4);
      }

      playAnnouncer(text) {
        if (this.isMuted) return;
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.pitch = 0.65;
          utterance.rate = 1.05;
          utterance.lang = 'es-PE';
          window.speechSynthesis.speak(utterance);
        }
      }

      playBGM(trackName) {
        if (this.currentTrack === trackName) return;
        this.stopBGM();
        this.currentTrack = trackName;
        this.init();
        if (!this.ctx || this.isMuted) return;

        const notes = {
          title: [261, 329, 392, 523, 392, 329, 261, 196],
          charSelect: [330, 392, 440, 523, 440, 392, 330, 261],
          stageSelect: [220, 277, 330, 440, 330, 277, 220, 164],
          canchita: [293, 349, 440, 587, 440, 349, 293, 220],
          basket: [196, 246, 293, 392, 293, 246, 196, 146],
          casa_diego: [164, 220, 246, 329, 246, 220, 164, 130],
          salon_4A: [349, 440, 523, 698, 523, 440, 349, 261],
          catequesis: [174, 220, 261, 349, 261, 220, 174, 130],
          gameover: [523, 440, 349, 261, 196, 130]
        };

        const seq = notes[trackName] || notes.title;
        let step = 0;

        this.bgmTimer = setInterval(() => {
          if (this.isMuted || !this.ctx) return;
          const freq = seq[step % seq.length];
          step++;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.16);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.16);
        }, 190);
      }

      stopBGM() {
        if (this.bgmTimer) {
          clearInterval(this.bgmTimer);
          this.bgmTimer = null;
        }
        this.currentTrack = null;
      }
    }

    function DetailedPixelAvatar({ character, size }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.clearRect(0, 0, size, size);

        const grid = 24;
        const pSize = size / grid;

        const px = (x, y, color) => {
          ctx.fillStyle = color;
          ctx.fillRect(Math.floor(x * pSize), Math.floor(y * pSize), Math.ceil(pSize), Math.ceil(pSize));
        };

        const skin = character.skinHex;
        const skinDark = character.skinDarkHex || '#523420';

        for (let x = 6; x <= 17; x++) {
          for (let y = 5; y <= 16; y++) {
            px(x, y, skin);
          }
        }
        for (let y = 12; y <= 16; y++) {
          px(6, y, skinDark);
          px(17, y, skinDark);
        }

        px(8, 10, '#ffffff'); px(9, 10, '#ffffff');
        px(8, 11, '#ffffff'); px(9, 11, '#ffffff');
        px(9, 10, '#0f172a'); px(9, 11, '#0f172a');

        px(14, 10, '#ffffff'); px(15, 10, '#ffffff');
        px(14, 11, '#ffffff'); px(15, 11, '#ffffff');
        px(14, 10, '#0f172a'); px(14, 11, '#0f172a');

        px(11, 12, skinDark); px(12, 12, skinDark);
        px(10, 14, '#7f1d1d'); px(11, 14, '#7f1d1d'); px(12, 14, '#7f1d1d'); px(13, 14, '#7f1d1d');

        if (character.glasses) {
          for (let x = 7; x <= 16; x++) px(x, 10, '#1e293b');
          px(7, 11, '#1e293b'); px(10, 11, '#1e293b');
          px(13, 11, '#1e293b'); px(16, 11, '#1e293b');
          px(8, 11, '#38bdf8'); px(14, 11, '#38bdf8');
        }

        const hair = character.hairColor;
        if (character.hairStyle === 'afro-fade') {
          for (let x = 5; x <= 18; x++) {
            px(x, 2, hair); px(x, 3, hair); px(x, 4, hair);
          }
        } else {
          for (let x = 6; x <= 17; x++) {
            px(x, 3, hair); px(x, 4, hair);
          }
        }

        for (let x = 5; x <= 18; x++) {
          for (let y = 17; y <= 23; y++) {
            px(x, y, character.shirtColor);
          }
        }
      }, [character, size]);

      return <canvas ref={canvasRef} width={size} height={size} className="image-rendering-pixelated" />;
    }

      const [p1Hp, setP1Hp] = useState(100);

      const [announcement, setAnnouncement] = useState('ROUND 1 ... A PELEAR!');

      const fightersRef = useRef({
        p1: {
          x: 220,
          y: 320,
          vx: 0,
          vy: 0,
          hp: 100,
          meter: 0,
          facing: 1,
          state: 'idle',
          char: p1Char,
          isGrounded: true,
          hitboxActive: false,
          attackType: null,
          comboHits: 0
        },
        p2: {
          x: 680,
          y: 320,
          vx: 0,
          vy: 0,
          hp: 100,
          meter: 0,
          facing: -1,
          state: 'idle',
          char: p2Char,
          isGrounded: true,
          hitboxActive: false,
          attackType: null,
          comboHits: 0
        }
      });

      const keysPressed = useRef({});

      // Touch Control Input Helpers
      const handleTouchStart = (key) => {
        keysPressed.current[key] = true;
      };

      const handleTouchEnd = (key) => {
        keysPressed.current[key] = false;
      };

      useEffect(() => {
        const handleKeyDown = (e) => (keysPressed.current[e.key.toLowerCase()] = true);
        const handleKeyUp = (e) => (keysPressed.current[e.key.toLowerCase()] = false);

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);

        const announceTimer = setTimeout(() => setAnnouncement(''), 2200);

        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
          clearTimeout(announceTimer);
        };
      }, []);

      useEffect(() => {
        const timer = setInterval(() => {
          setRoundTimer((prev) => (prev <= 1 ? 0 : prev - 1));
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // Main Game Loop (60 FPS)
      useEffect(() => {
        let animationFrameId;
        let frameCount = 0;

        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const updateAndRender = () => {
          frameCount++;
          const p1 = fightersRef.current.p1;
          const p2 = fightersRef.current.p2;
          const stageFloor = canvas.height - 90;

          // Player 1 Control Logic
          if (p1.hp > 0 && p1.state !== 'hurt') {
            if (keysPressed.current['s']) {
              p1.state = 'crouch';
              p1.vx = 0;
            } else if (keysPressed.current['a']) {
              p1.vx = -4.5 * (p1.char.stats.speed / 7);
              p1.state = p1.facing === 1 ? 'block' : 'walk';
            } else if (keysPressed.current['d']) {
              p1.vx = 4.5 * (p1.char.stats.speed / 7);
              p1.state = p1.facing === -1 ? 'block' : 'walk';
            } else {
              p1.vx = 0;
              if (p1.isGrounded && p1.state !== 'attack') p1.state = 'idle';
            }

            if (keysPressed.current['w'] && p1.isGrounded) {
              p1.vy = -15;
              p1.isGrounded = false;
              p1.state = 'jump';
            }

            // Attacks
            if (keysPressed.current['f'] && p1.state !== 'attack') {
              triggerAttack(p1, p2, 'light', 8, 70);
            } else if (keysPressed.current['g'] && p1.state !== 'attack') {
              triggerAttack(p1, p2, 'heavy', 16, 90);
            } else if (keysPressed.current['h'] && p1.meter >= 100 && p1.state !== 'attack') {
              p1.meter = 0;
              setP1Meter(0);
              soundEngine.playSuper();
              setAnnouncement(`${p1.char.name.toUpperCase()}: SUPER!`);
              triggerAttack(p1, p2, 'super', 38, 130);
              setTimeout(() => setAnnouncement(''), 1500);
            }
          }

          // Player 2 / CPU Logic
          if (p2.hp > 0 && p2.state !== 'hurt') {
            if (gameMode === 'VS_LOCAL') {
              if (keysPressed.current['arrowdown']) {
                p2.state = 'crouch';
                p2.vx = 0;
              } else if (keysPressed.current['arrowleft']) {
                p2.vx = -4.5 * (p2.char.stats.speed / 7);
                p2.state = p2.facing === 1 ? 'block' : 'walk';
              } else if (keysPressed.current['arrowright']) {
                p2.vx = 4.5 * (p2.char.stats.speed / 7);
                p2.state = p2.facing === -1 ? 'block' : 'walk';
              } else {
                p2.vx = 0;
                if (p2.isGrounded && p2.state !== 'attack') p2.state = 'idle';
              }

              if (keysPressed.current['arrowup'] && p2.isGrounded) {
                p2.vy = -15;
                p2.isGrounded = false;
                p2.state = 'jump';
              }

              if (keysPressed.current['1'] && p2.state !== 'attack') {
                triggerAttack(p2, p1, 'light', 8, 70);
              } else if (keysPressed.current['2'] && p2.state !== 'attack') {
                triggerAttack(p2, p1, 'heavy', 16, 90);
              }
            } else {
              // CPU AI behavior
              const dist = Math.abs(p1.x - p2.x);
              if (dist > 70) {
                p2.vx = Math.sign(p1.x - p2.x) * 3.5 * (p2.char.stats.speed / 7);
                p2.state = 'walk';
              } else {
                p2.vx = 0;
                if (Math.random() < 0.05 && p2.state !== 'attack') {
                  triggerAttack(p2, p1, Math.random() > 0.5 ? 'light' : 'heavy', 12, 80);
                }
              }
            }
          }

          // Physics integration
          [p1, p2].forEach((f) => {
            f.x += f.vx;
            f.y += f.vy;

            if (!f.isGrounded) f.vy += 0.85;

            if (f.y >= stageFloor) {
              f.y = stageFloor;
              f.vy = 0;
              f.isGrounded = true;
            }

            f.x = Math.max(50, Math.min(canvas.width - 50, f.x));
          });

          p1.facing = p1.x < p2.x ? 1 : -1;
          p2.facing = p2.x < p1.x ? 1 : -1;

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          stage.drawBg(ctx, canvas.width, canvas.height, frameCount);

          renderFighterSprite(ctx, p1, frameCount, showHitboxes);
          renderFighterSprite(ctx, p2, frameCount, showHitboxes);

          if (p1.hp <= 0 || p2.hp <= 0 || roundTimer === 0) {
            onMatchEnd(p1.hp > p2.hp ? 1 : 2);
            return;
          }

          animationFrameId = requestAnimationFrame(updateAndRender);
        };

        animationFrameId = requestAnimationFrame(updateAndRender);
        return () => cancelAnimationFrame(animationFrameId);
      }, [stage, gameMode, showHitboxes, roundTimer]);

      const triggerAttack = (attacker, defender, type, baseDmg, reach) => {
        attacker.state = 'attack';
        attacker.attackType = type;
        attacker.hitboxActive = true;

        if (type === 'light') soundEngine.playPunch();
        else if (type === 'heavy') soundEngine.playKick();

        const attackerX = attacker.x + (attacker.facing * 30);
        const defenderX = defender.x;

        if (Math.abs(attackerX - defenderX) <= reach) {
          if (defender.state === 'block') {
            soundEngine.playBlock();
            defender.hp -= Math.floor(baseDmg * 0.2);
          } else {
            defender.hp -= baseDmg;
            defender.state = 'hurt';
            attacker.meter = Math.min(100, attacker.meter + 22);
            attacker.comboHits += 1;

            if (attacker === fightersRef.current.p1) {
              setP1Meter(attacker.meter);
              setComboP1(attacker.comboHits);
              setTimeout(() => setComboP1(0), 1200);
            } else {
              setP2Meter(attacker.meter);
              setComboP2(attacker.comboHits);
              setTimeout(() => setComboP2(0), 1200);
            }

            setTimeout(() => (defender.state = 'idle'), 280);
          }

          setP1Hp(Math.max(0, fightersRef.current.p1.hp));
          setP2Hp(Math.max(0, fightersRef.current.p2.hp));
        }

        setTimeout(() => {
          attacker.state = 'idle';
          attacker.hitboxActive = false;
        }, type === 'light' ? 200 : 320);
      };

      const showTouchControls = touchControlsMode === 'ALWAYS' || (touchControlsMode === 'AUTO');

      return (
        <div className="relative w-full h-full flex flex-col items-center justify-center bg-black select-none">
          
          {/* Health HUD Header */}
          <div className="absolute top-3 inset-x-4 z-20 flex justify-between items-center max-w-5xl mx-auto">
            <div className="w-5/12 flex flex-col">
              <div className="flex justify-between items-baseline mb-1">
                <span className="font-black text-amber-300 text-xs sm:text-sm drop-shadow">{p1Char.name}</span>
                {comboP1 > 1 && <span className="text-[10px] font-black text-yellow-400 animate-bounce">{comboP1} COMBO!</span>}
              </div>
              <div className="w-full bg-slate-900 border-2 sm:border-4 border-amber-400 h-4 sm:h-6 shadow-2xl relative">
                <div className="h-full bg-gradient-to-r from-emerald-500 to-green-400 transition-all duration-150" style={{ width: `${p1Hp}%` }}></div>
              </div>
              <div className="w-full bg-slate-900 border border-cyan-400 h-2.5 sm:h-3 mt-1 relative">
                <div className="h-full bg-cyan-400 transition-all duration-150" style={{ width: `${p1Meter}%` }}></div>
              </div>
            </div>

            <div className="w-12 h-12 sm:w-16 sm:h-16 bg-slate-950 border-2 sm:border-4 border-amber-400 flex items-center justify-center shadow-2xl">
              <span className="text-xl sm:text-2xl font-black text-amber-300 font-vt323">{roundTimer}</span>
            </div>

            <div className="w-5/12 flex flex-col items-end">
              <div className="flex justify-between items-baseline w-full mb-1">
                {comboP2 > 1 && <span className="text-[10px] font-black text-yellow-400 animate-bounce">{comboP2} COMBO!</span>}
                <span className="font-black text-amber-300 text-xs sm:text-sm drop-shadow ml-auto">{p2Char.name}</span>
              </div>
              <div className="w-full bg-slate-900 border-2 sm:border-4 border-amber-400 h-4 sm:h-6 shadow-2xl relative">
                <div className="h-full bg-gradient-to-r from-emerald-500 to-green-400 ml-auto transition-all duration-150" style={{ width: `${p2Hp}%` }}></div>
              </div>
              <div className="w-full bg-slate-900 border border-red-500 h-2.5 sm:h-3 mt-1 relative">
                <div className="h-full bg-red-500 ml-auto transition-all duration-150" style={{ width: `${p2Meter}%` }}></div>
              </div>
            </div>
          </div>

          {/* Announcer Banner */}
          {announcement && (
            <div className="absolute z-30 text-center animate-pulse">
              <h1 className="text-xl sm:text-4xl font-black italic text-amber-300 bg-slate-950/90 px-6 py-3 border-4 border-amber-500 shadow-2xl">
                {announcement}
              </h1>
            </div>
          )}

          {/* Main Fight Canvas */}
          <canvas ref={canvasRef} width={900} height={450} className="w-full max-w-5xl aspect-[2/1] border-4 sm:border-8 border-slate-800 shadow-2xl" />

          {}
          {showTouchControls && (
            <div className="absolute bottom-2 inset-x-2 z-40 flex justify-between items-end p-2 pointer-events-none">
              
              {/* Virtual D-Pad */}
              <div className="pointer-events-auto relative w-36 h-36 bg-slate-900/80 border-2 border-amber-400/60 rounded-full flex items-center justify-center shadow-2xl">
                <button
                  onTouchStart={(e) => { e.preventDefault(); handleTouchStart('w'); }}
                  onTouchEnd={(e) => { e.preventDefault(); handleTouchEnd('w'); }}
                  className="touch-btn absolute top-1 w-10 h-10 bg-slate-800 border-2 border-amber-400 text-amber-300 font-bold rounded flex items-center justify-center text-xs"
                >
                  ▲
                </button>
                <button
                  onTouchStart={(e) => { e.preventDefault(); handleTouchStart('a'); }}
                  onTouchEnd={(e) => { e.preventDefault(); handleTouchEnd('a'); }}
                  className="touch-btn absolute left-1 w-10 h-10 bg-slate-800 border-2 border-amber-400 text-amber-300 font-bold rounded flex items-center justify-center text-xs"
                >
                  ◀
                </button>
                <button
                  onTouchStart={(e) => { e.preventDefault(); handleTouchStart('s'); }}
                  onTouchEnd={(e) => { e.preventDefault(); handleTouchEnd('s'); }}
                  className="touch-btn absolute bottom-1 w-10 h-10 bg-slate-800 border-2 border-amber-400 text-amber-300 font-bold rounded flex items-center justify-center text-xs"
                >
                  ▼
                </button>
                <button
                  onTouchStart={(e) => { e.preventDefault(); handleTouchStart('d'); }}
                  onTouchEnd={(e) => { e.preventDefault(); handleTouchEnd('d'); }}
                  className="touch-btn absolute right-1 w-10 h-10 bg-slate-800 border-2 border-amber-400 text-amber-300 font-bold rounded flex items-center justify-center text-xs"
                >
                  ▶
                </button>
              </div>

              {/* Action Buttons */}
              <div className="pointer-events-auto flex gap-2 items-center">
                <button
                  onTouchStart={(e) => { e.preventDefault(); handleTouchStart('f'); }}
                  onTouchEnd={(e) => { e.preventDefault(); handleTouchEnd('f'); }}
                  className="touch-btn w-12 h-12 bg-red-600 border-2 border-yellow-300 rounded-full font-black text-[9px] text-white flex items-center justify-center shadow-lg"
                >
                  GOLPE
                </button>
                <button
                  onTouchStart={(e) => { e.preventDefault(); handleTouchStart('g'); }}
                  onTouchEnd={(e) => { e.preventDefault(); handleTouchEnd('g'); }}
                  className="touch-btn w-12 h-12 bg-blue-600 border-2 border-yellow-300 rounded-full font-black text-[9px] text-white flex items-center justify-center shadow-lg"
                >
                  PATADA
                </button>
                <button
                  onTouchStart={(e) => { e.preventDefault(); handleTouchStart('h'); }}
                  onTouchEnd={(e) => { e.preventDefault(); handleTouchEnd('h'); }}
                  className="touch-btn w-12 h-12 bg-gradient-to-tr from-amber-500 to-yellow-300 border-2 border-white rounded-full font-black text-[9px] text-slate-950 flex items-center justify-center shadow-lg animate-pulse"
                >
                  SUPER
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function renderFighterSprite(ctx, fighter, frame, showHitboxes) {
      const { x, y, facing, state, char, hitboxActive, attackType } = fighter;
      const p = 4;

      ctx.save();
      ctx.translate(x, y);
      ctx.scale(facing, 1);

      const block = (bx, by, bw, bh, color) => {
        ctx.fillStyle = color;
        ctx.fillRect(bx * p, by * p, bw * p, bh * p);
      };

      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.ellipse(0, 0, 24, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      const skin = char.skinHex;
      const skinDark = char.skinDarkHex || '#523420';

      const yShift = state === 'crouch' ? 10 : 0;

      block(-6, -30 + yShift, 12, 10, skin);
      block(-6, -24 + yShift, 2, 4, skinDark);
      
      block(1, -27 + yShift, 2, 2, '#ffffff');
      block(2, -27 + yShift, 1, 2, '#0f172a');

      block(-7, -33 + yShift, 14, 4, char.hairColor);
      block(-7, -20 + yShift, 14, 12, char.shirtColor);

      if (state === 'attack' && attackType === 'heavy') {
        block(-6, -8 + yShift, 6, 8, char.pantsColor);
        block(0, -18 + yShift, 14, 5, char.pantsColor);
      } else if (state === 'crouch') {
        block(-8, -8 + yShift, 16, 8, char.pantsColor);
      } else {
        block(-6, -8 + yShift, 5, 8, char.pantsColor);
        block(1, -8 + yShift, 5, 8, char.pantsColor);
      }

      if (state === 'attack' && attackType === 'light') {
        block(4, -18 + yShift, 14, 4, skin);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(18 * p, -20 * p, 4 * p, 8 * p);
      } else {
        block(4, -18 + yShift, 4, 8, skin);
      }

      if (state === 'hurt') {
        ctx.fillStyle = 'rgba(239, 68, 68, 0.4)';
        ctx.fillRect(-10 * p, -35 * p, 20 * p, 35 * p);
      }

      if (showHitboxes) {
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 2;
        ctx.strokeRect(-8 * p, (-32 + yShift) * p, 16 * p, (32 - yShift) * p);

        if (hitboxActive) {
          ctx.strokeStyle = '#ef4444';
          ctx.fillStyle = 'rgba(239, 68, 68, 0.3)';
          const reach = attackType === 'super' ? 24 : 16;
          ctx.fillRect(4 * p, (-22 + yShift) * p, reach * p, 10 * p);
          ctx.strokeRect(4 * p, (-22 + yShift) * p, reach * p, 10 * p);
        }
      }

      ctx.restore();
    }

    function GameOverScreen({ winner, p1Char, p2Char, onRestart }) {
      const winnerChar = winner === 1 ? p1Char : p2Char;

      return (
        <div className="w-full h-full flex flex-col items-center justify-center bg-slate-950 p-6 text-center border-8 border-amber-500">
          <h2 className="text-xs font-black text-amber-400 uppercase tracking-widest mb-2">
            ★ K.O. VICTORIA FINAL ★
          </h2>
          
          <h1 className="text-2xl sm:text-5xl font-black italic text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-red-500 mb-4">
            ¡{winnerChar.name.toUpperCase()} GANA!
          </h1>

          <div className="w-28 h-28 sm:w-36 sm:h-36 my-4 bg-slate-900 border-4 border-amber-400 flex items-center justify-center shadow-2xl">
            <DetailedPixelAvatar character={winnerChar} size={110} />
          </div>

          <p className="text-xs text-cyan-300 italic max-w-md my-4">
            "{winnerChar.quote}"
          </p>

          <button
            onClick={onRestart}
            className="px-6 py-3.5 bg-gradient-to-r from-amber-500 to-red-600 text-slate-950 font-black text-xs border-4 border-yellow-300 shadow-2xl btn-arcade mt-4"
          >
            🔄 VOLVER AL MENÚ PRINCIPAL
          </button>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
